  <!-- Círculo central preto -->
  <circle cx="27" cy="27" r="5" fill="#000000"/>

  <!-- Símbolo de reciclagem simplificado -->
  <g fill="#000000" transform="translate(27, 27)">
    <g transform="rotate(0)">
      <path d="M0,-18 L-5,-10 L-2,-10 L-2,-4 L2,-4 L2,-10 L5,-10 Z"/>
