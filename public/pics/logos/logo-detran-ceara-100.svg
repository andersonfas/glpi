    </g>
    <g transform="rotate(240)">
      <path d="M0,-18 L-5,-10 L-2,-10 L-2,-4 L2,-4 L2,-10 L5,-10 Z"/>
      <path d="M2,-4 Q10,2 10,10 L14,6 L10,16 L6,8 L9,10 Q8,4 2,-2"/>
