<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 55" width="100" height="55">
  <!-- Logo DETRAN Ceará - Versão Menu (100x55) -->
  <!-- Círculo amarelo com símbolo -->
  <circle cx="27" cy="27.5" r="24" fill="#FFE500"/>
  <circle cx="27" cy="27.5" r="22" fill="#FFE500" stroke="#2D3436" stroke-width="2"/>

  <!-- Símbolo do trânsito estilizado (3 setas em círculo) -->
  <g fill="#2D3436" transform="translate(27, 27.5)">
    <!-- Seta 1 - topo -->
    <path d="M0,-16 L6,-6 L2,-6 L2,2 L-2,2 L-2,-6 L-6,-6 Z" transform="rotate(0)"/>
    <!-- Seta 2 - direita baixo -->
    <path d="M0,-16 L6,-6 L2,-6 L2,2 L-2,2 L-2,-6 L-6,-6 Z" transform="rotate(120)"/>
    <!-- Seta 3 - esquerda baixo -->
    <path d="M0,-16 L6,-6 L2,-6 L2,2 L-2,2 L-2,-6 L-6,-6 Z" transform="rotate(240)"/>
  </g>

  <!-- Texto DETRAN-CE embaixo do círculo (pequeno) -->
  <text x="27" y="53" font-family="Arial Black, Arial, sans-serif" font-size="6" font-weight="bold" fill="#2D3436" text-anchor="middle">DETRAN-CE</text>
</svg>
