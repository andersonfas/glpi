<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Logo DETRAN Ceará - Ícone Oficial -->

  <!-- Círculo amarelo com borda preta -->
  <circle cx="50" cy="50" r="44" fill="#FFFF00" stroke="#000000" stroke-width="5"/>

  <!-- Círculo central preto -->
  <circle cx="50" cy="50" r="9" fill="#000000"/>

  <!-- Símbolo Möbius - 3 setas curvas entrelaçadas -->
  <g fill="#000000">
    <!-- Seta Superior - ponta para cima -->
    <path d="M50,12 L42,26 L46,26 L46,32 Q46,42 50,48 Q54,42 54,32 L54,26 L58,26 Z"/>
    <!-- Curva direita da seta superior -->
    <path d="M54,45 Q68,52 76,68 L70,68 Q78,82 86,68 L80,68 Q72,52 58,42"/>

    <!-- Seta Inferior Direita - ponta para baixo-direita -->
    <path d="M80,72 L86,60 L82,64 Q72,48 56,44 L54,50 Q66,54 74,66 L70,68 Z"/>
    <!-- Curva inferior -->
    <path d="M76,78 Q62,90 44,88 Q28,86 18,74 L26,74 Q34,82 50,82 Q64,82 72,74"/>

    <!-- Seta Inferior Esquerda - ponta para baixo-esquerda -->
    <path d="M20,72 L14,60 L18,64 Q28,48 44,44 L46,50 Q34,54 26,66 L30,68 Z"/>
    <!-- Curva esquerda -->
    <path d="M46,45 Q32,52 24,68 L30,68 Q22,82 14,68 L20,68 Q28,52 42,42"/>
  </g>
</svg>
