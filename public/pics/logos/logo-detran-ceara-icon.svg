<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Logo DETRAN Ceará - Ícone Reduzido (50x50) -->

  <!-- Círculo amarelo -->
  <circle cx="25" cy="25" r="23" fill="#FFE500"/>
  <circle cx="25" cy="25" r="21" fill="#FFE500" stroke="#2D3436" stroke-width="2"/>

  <!-- Símbolo do trânsito estilizado (3 setas em círculo) -->
  <g fill="#2D3436" transform="translate(25, 25)">
    <!-- Seta 1 - topo -->
    <path d="M0,-15 L5,-7 L2,-7 L2,1 L-2,1 L-2,-7 L-5,-7 Z" transform="rotate(0)"/>
    <!-- Seta 2 - direita baixo -->
    <path d="M0,-15 L5,-7 L2,-7 L2,1 L-2,1 L-2,-7 L-5,-7 Z" transform="rotate(120)"/>
    <!-- Seta 3 - esquerda baixo -->
    <path d="M0,-15 L5,-7 L2,-7 L2,1 L-2,1 L-2,-7 L-5,-7 Z" transform="rotate(240)"/>
  </g>
</svg>
