    <path d="M125,20 L115,38 L120,38 C120,50 122,58 125,63 C128,58 130,50 130,38 L135,38 Z"/>
    <path d="M130,58 C140,65 152,75 160,90 L153,90 L170,115 L187,90 L177,90 C168,72 152,60 137,53 Z"/>

